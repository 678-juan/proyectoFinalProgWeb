<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formación Académica - Hoja de Vida</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/formacion-academica.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Formato Único Hoja de Vida</h1>
        <p>Persona Natural</p>
    </header>

    <div class="layout">
        <div id="sidebar"></div>
        <main>
            <section id="formacion-academica">
                <h2>2. Formación Académica</h2>

                <h3>Educación Básica y Media</h3>
                <div class="campo">
                    <label for="ultimoGrado">Último grado aprobado *</label>
                    <select id="ultimoGrado"></select>
                </div>

                <div class="campo" id="seccionMesGrado" style="display:none">
                    <label for="mesGrado">Mes de Grado</label>
                    <select id="mesGrado">
                        <option value="">-- Seleccione --</option>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>

                <div class="campo" id="seccionAnioGrado" style="display:none">
                    <label for="anioGrado">Año de Grado</label>
                    <select id="anioGrado"></select>
                </div>

                <!-- Sección superior oculta hasta grado 11 -->
                <div id="seccionSuperior" style="display:none">
                    <h3>Educación Superior</h3>
                    <div id="listaEstudios"></div>
                    <button onclick="agregarEstudio()">+ Agregar Estudio</button>

                    <h3>Idiomas</h3>
                    <div id="listaIdiomas"></div>
                    <button onclick="agregarIdioma()">+ Agregar Idioma</button>
                </div>

                <p id="errorFormacion"></p>
                <button onclick="verResumenFormacion()">Vista Previa</button>
            </section>

            <section id="resumenFormacion" style="display:none">
                <h2>Resumen — Formación Académica</h2>
                <div id="contenidoResumenFormacion"></div>
                <button onclick="editarFormacion()">Editar</button>
                <button onclick="continuarFormacion()">Continuar →</button>
            </section>
        </main>
    </div>

    <footer>
        <p>DAFP — Línea gratuita: 018000917770</p>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/validations.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/formacion-academica.js"></script>

</body>
</html>
